name: Build Offline HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .speech-assets
          key: whisper-tiny-q8-v1
      - run: npm install
      - run: npm test
      - run: npm run build:offline
      - uses: actions/upload-artifact@v4
        with:
          name: eb-sucht-offline
          path: dist-offline/eb-sucht-offline.html
          if-no-files-found: error
          retention-days: 30
